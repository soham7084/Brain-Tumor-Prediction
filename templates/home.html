<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Modern Space/Neon Theme */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            /* Creates a dark, deep space gradient background */
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f16 100%);
        }

        .main-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0a0b0;
            margin-bottom: 40px;
        }

        .subtitle i {
            color: #00c8ff;
            margin-left: 8px;
        }

        /* Custom Upload Box Styling */
        .upload-zone {
            position: relative;
            border: 2px dashed #00c8ff;
            border-radius: 20px;
            background: rgba(0, 200, 255, 0.03);
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-zone:hover {
            background: rgba(0, 200, 255, 0.08);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.2);
            border-color: #00e5ff;
        }

        .cloud-icon {
            font-size: 4rem;
            color: #00c8ff;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.5));
        }

        .upload-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .drag-text {
            color: #888899;
            font-size: 1rem;
        }

        /* Hide the default ugly file input */
        .hidden-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Styled Submit Button */
        .submit-btn {
            margin-top: 30px;
            background: linear-gradient(90deg, #00c8ff, #0077ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>BRAIN TUMOR DETECTION</h1>
        <p class="subtitle">Upload MRI image to get started <i class="fa-solid fa-arrow-down"></i></p>

        <form method="POST" enctype="multipart/form-data">
            {{ form.hidden_tag() }}
            
            <div class="upload-zone" id="drop-zone">
                <i class="fa-solid fa-cloud-arrow-up cloud-icon"></i>
                <span class="upload-text" id="file-name">Choose file...</span>
                <span class="drag-text" id="file-subtext">Or drag & drop here</span>
                
                {{ form.file(class="hidden-input", id="file-input", accept="image/*") }}
            </div>

            <div>
                {{ form.submit(class="submit-btn", value="Analyze Scan") }}
            </div>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const fileSubtext = document.getElementById('file-subtext');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                // Update text to show the selected file name
                fileNameDisplay.textContent = e.target.files[0].name;
                fileNameDisplay.style.color = '#00c8ff';
                fileSubtext.textContent = "Ready to analyze!";
            }
        });
    </script>

</body>
</html>
